# Admin console edge. Agent mTLS listener (port 8443) is added in Phase 2.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/console.crt;
    ssl_certificate_key /etc/nginx/certs/console.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    root /usr/share/nginx/html;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}

# ---------------------------------------------------------------------------------------------------------------
# Agent channel: mutual TLS. Only devices holding a certificate issued by the internal device CA can connect.
# The API additionally verifies the per-request signature and checks the forwarded certificate against the device's
# *currently active* certificate (AGENT_REQUIRE_MTLS=true), so revocation is immediate without CRLs.
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate        /etc/nginx/certs/agent.crt;
    ssl_certificate_key    /etc/nginx/certs/agent.key;
    ssl_client_certificate /etc/nginx/certs/device-ca.crt;
    ssl_verify_client      optional;   # enrollment happens before the device has a certificate
    ssl_verify_depth       1;
    ssl_protocols          TLSv1.3;
    server_tokens off;
    client_max_body_size 256k;

    location = /agent/v1/enroll {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-Cert "";
    }

    location /agent/v1/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header X-Real-IP $remote_addr;
        # Verified client certificate (URL-encoded PEM); the API derives the SHA-256 fingerprint itself.
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    }

    location / { return 404; }
}
