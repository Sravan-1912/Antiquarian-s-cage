<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Animated diagram of the Antiquarian's Cage cross-network RDP relay">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2740"/>
      <stop offset="1" stop-color="#131c30"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#15263f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="380" fill="url(#bg)" rx="14"/>
  <text x="430" y="34" fill="#e6edf7" font-size="19" font-weight="700" text-anchor="middle">Cross-network RDP relay — no VPN, no inbound firewall hole</text>
  <text x="430" y="56" fill="#7f94b5" font-size="13" text-anchor="middle">Both sides dial OUT to the backend, which bridges the bytes. The server can be anywhere.</text>

  <!-- paths the packets travel (invisible) -->
  <path id="pL" d="M 190 200 C 300 200, 320 210, 400 210" fill="none"/>
  <path id="pR" d="M 670 200 C 560 200, 540 210, 460 210" fill="none"/>

  <!-- connector lines -->
  <path d="M 190 200 C 300 200, 320 210, 400 210" stroke="#2f466b" stroke-width="2.5" fill="none" stroke-dasharray="6 6"/>
  <path d="M 670 200 C 560 200, 540 210, 460 210" stroke="#2f466b" stroke-width="2.5" fill="none" stroke-dasharray="6 6"/>
  <text x="270" y="188" fill="#6c82a6" font-size="11" text-anchor="middle">dial out ▸ wss://</text>
  <text x="590" y="188" fill="#6c82a6" font-size="11" text-anchor="middle">◂ dial out  wss://</text>

  <!-- Endpoint -->
  <g>
    <rect x="40" y="150" width="150" height="100" rx="12" fill="url(#box)" stroke="#2c3e5e"/>
    <rect x="62" y="172" width="106" height="46" rx="5" fill="#0c1424" stroke="#3a5178"/>
    <rect x="86" y="222" width="58" height="7" rx="3" fill="#3a5178"/>
    <text x="115" y="262" fill="#cdd9ee" font-size="12.5" font-weight="600" text-anchor="middle">Endpoint agent</text>
    <text x="115" y="140" fill="#8aa0c4" font-size="11" text-anchor="middle">127.0.0.1:3389 (RDP / xrdp)</text>
    <!-- banner -->
    <g filter="url(#glow)">
      <rect x="52" y="112" width="126" height="20" rx="5" fill="#b4232a"/>
      <text x="115" y="126" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle">● REMOTE DESKTOP ACTIVE</text>
      <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Backend relay hub -->
  <g>
    <rect x="360" y="150" width="140" height="100" rx="12" fill="url(#hub)" stroke="#34558a"/>
    <circle cx="430" cy="190" r="15" fill="none" stroke="#5aa6ff" stroke-width="2.5"/>
    <path d="M 430 178 L 430 202 M 418 190 L 442 190" stroke="#5aa6ff" stroke-width="2.5"/>
    <text x="430" y="228" fill="#cfe2ff" font-size="12.5" font-weight="600" text-anchor="middle">Backend relay</text>
    <text x="430" y="244" fill="#7f9bc4" font-size="10.5" text-anchor="middle">pairs the two tunnels</text>
  </g>

  <!-- Operator -->
  <g>
    <rect x="670" y="150" width="150" height="100" rx="12" fill="url(#box)" stroke="#2c3e5e"/>
    <rect x="692" y="172" width="106" height="46" rx="5" fill="#0c1424" stroke="#3a5178"/>
    <rect x="716" y="222" width="58" height="7" rx="3" fill="#3a5178"/>
    <text x="745" y="262" fill="#cdd9ee" font-size="12.5" font-weight="600" text-anchor="middle">Operator console</text>
    <text x="745" y="140" fill="#8aa0c4" font-size="11" text-anchor="middle">mstsc / RDP viewer</text>
  </g>

  <!-- animated packets: operator -> endpoint (input), blue -->
  <circle r="5" fill="#5aa6ff" filter="url(#glow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#pR"/></animateMotion>
  </circle>
  <circle r="5" fill="#5aa6ff" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#pR"/></animateMotion>
  </circle>
  <circle r="5" fill="#5aa6ff" filter="url(#glow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear">
      <mpath href="#pL"/></animateMotion>
  </circle>
  <circle r="5" fill="#5aa6ff" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear">
      <mpath href="#pL"/></animateMotion>
  </circle>

  <!-- animated packets: endpoint -> operator (screen), green -->
  <circle r="4" fill="#53e0a3" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="0.55s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#pL"/></animateMotion>
  </circle>
  <circle r="4" fill="#53e0a3" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="1.65s" repeatCount="indefinite"><mpath href="#pR"/></animateMotion>
  </circle>

  <rect x="40" y="306" width="14" height="14" rx="3" fill="#5aa6ff"/>
  <text x="62" y="317" fill="#9fb3d6" font-size="12">operator input (keys / mouse)</text>
  <rect x="300" y="306" width="14" height="14" rx="3" fill="#53e0a3"/>
  <text x="322" y="317" fill="#9fb3d6" font-size="12">endpoint screen frames</text>
  <text x="40" y="346" fill="#6c82a6" font-size="11">Stateless HMAC tunnel tokens, side-bound (endpoint|operator). Signed commands enable RDP only while the banner shows.</text>
</svg>
